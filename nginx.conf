server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Qualquer rota que não seja um arquivo real (ex: /login, /cadastro)
    # cai de volta no index.html, deixando o React Router decidir o que mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos estáticos (JS, CSS, imagens) podem ficar em cache por mais tempo.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
